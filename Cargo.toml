[workspace]
resolver = "3"
members = ["crates/*"]
[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/xcomart/rudbkit"
[workspace.dependencies]
rudbkit-core = { path = "crates/rudbkit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
jni = { version = "0.22", features = ["invocation"] }
thiserror = "2"
# The dialect profiles (`rudbkit-core`'s `dialects`). Both applications already
# take each: `anyhow` for their errors; `serde_norway`, the maintained
# `serde_yaml` fork rugpui picked, for YAML; `sha2` for the hashes the
# shipped-file record and the allow list keep.
anyhow = "1"
serde_norway = "0.9"
sha2 = "0.11"
tempfile = "3"
# The ids of a tunnel's jump hosts (`rudbkit-core`'s `JumpHost`), which name
# each hop's keychain slot. Both applications already take it with these
# features for their profile ids.
uuid = { version = "1", features = ["v4", "serde"] }
