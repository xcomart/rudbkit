name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
# Third-party actions are pinned to a full commit SHA, with the release that SHA
# belongs to in a trailing comment; bump both together.
env:
  CARGO_TERM_COLOR: always
  # The toolchain every blocking job builds with. Pinned rather than `stable`
  # so a new Rust release cannot turn `clippy -D warnings` red on a commit
  # nobody touched; the `latest stable` job is where that shows up first,
  # without blocking. Keep it equal to the applications' pin, and bump it
  # deliberately, together with whatever new lints it brings.
  RUST_TOOLCHAIN: "1.98.0"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check documentation links
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # What the next toolchain bump will bring, ahead of time: the same lints on
  # whatever `stable` is today. Non-blocking, because a lint added upstream is
  # news, not a regression in the commit under test.
  latest-stable:
    name: latest stable (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Licences, banned crates and dependency sources (deny.toml) block;
  # advisories do not, because a RUSTSEC entry published today says nothing
  # about the commit under test and should not hold up unrelated work -- it
  # shows up as a red, non-blocking job instead.
  deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check ${{ matrix.checks }}
        run: cargo deny --locked check ${{ matrix.checks }}

  # rudbkit exists to be built into rudbman and rudbgen, so a change here is
  # only finished when they still compile against it. Each application's `dev`
  # branch is checked out next to this commit and the three rudbkit crates are
  # pointed at the local tree through `[patch."https://github.com/xcomart/rudbkit"]`,
  # passed with `--config` so the checkout itself stays untouched.
  #
  # `dev` rather than the default branch because that is where an application
  # moves to a new rudbkit revision; `main` only ever trails it. `cargo check`
  # rather than clippy, and without `--locked`: the lockfile has to change to
  # take the path crates, and an application's lints are its own business.
  #
  # Non-blocking for now. An intentional API change in rudbkit is red here
  # until each application adopts it, and the applications' `dev` can be behind
  # -- this job is the warning that tells you which one will need work, not a
  # gate. Make it blocking once the applications track rudbkit closely enough
  # that red here really does mean "broken".
  consumers:
    name: consumer ${{ matrix.app }} (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [rudbman, rudbgen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rudbkit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xcomart/${{ matrix.app }}
          ref: dev
          path: app
          persist-credentials: false
      # The applications draw with gpui, which links against these on Linux.
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app
          key: consumer-${{ matrix.app }}
      # The applications' JDBC crates refuse to build without the Java bridge
      # JAR. `cargo check` only needs the file to exist, so an empty one stands
      # in for a Gradle build.
      - name: Point the application at this rudbkit
        run: |
          lib="$GITHUB_WORKSPACE/rudbkit"
          cat > "$RUNNER_TEMP/rudbkit-under-test.toml" <<EOF
          [patch."https://github.com/xcomart/rudbkit"]
          rudbkit-core = { path = "$lib/crates/rudbkit-core" }
          rudbkit-ssh = { path = "$lib/crates/rudbkit-ssh" }
          rudbkit-jdbc = { path = "$lib/crates/rudbkit-jdbc" }
          EOF
          cat "$RUNNER_TEMP/rudbkit-under-test.toml"
          touch "$RUNNER_TEMP/bridge-placeholder.jar"
          echo "RUDBMAN_BRIDGE_JAR=$RUNNER_TEMP/bridge-placeholder.jar" >> "$GITHUB_ENV"
          echo "RUDBGEN_BRIDGE_JAR=$RUNNER_TEMP/bridge-placeholder.jar" >> "$GITHUB_ENV"
      # A version bump in rudbkit leaves the application's lockfile naming the
      # old version, and Cargo keeps a locked version rather than take a patch
      # carrying a newer one: the patch is reported unused and the check below
      # fails on every release. Re-resolving the patched crates the
      # application actually uses lets the path crates replace them whatever
      # version they carry. Only `[[package]]` names count -- a `[[patch.unused]]`
      # entry names a crate `cargo update -p` would refuse.
      - name: Re-resolve the patched crates
        working-directory: app
        run: |
          specs=()
          for crate in rudbkit-core rudbkit-ssh rudbkit-jdbc; do
            if grep -A1 -x '\[\[package\]\]' Cargo.lock | grep -qx "name = \"$crate\""; then
              specs+=(-p "$crate")
            fi
          done
          cargo update --config "$RUNNER_TEMP/rudbkit-under-test.toml" "${specs[@]}"
      # A crate the table above forgot would still resolve -- from the pinned
      # git revision -- and the check below would pass against the old code.
      - name: Nothing left on the pinned rudbkit revision
        working-directory: app
        run: |
          left=$(cargo tree --workspace --target all -e all --prefix none \
                   --config "$RUNNER_TEMP/rudbkit-under-test.toml" \
                 | grep -F 'github.com/xcomart/rudbkit' | sort -u || true)
          if [ -n "$left" ]; then
            echo "::error::still resolved from the rudbkit git source:"
            echo "$left"
            exit 1
          fi
      - name: cargo check
        working-directory: app
        run: cargo check --workspace --all-targets --config "$RUNNER_TEMP/rudbkit-under-test.toml"
